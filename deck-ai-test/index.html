<body>

  <script>

      tool: "deck-studio",
      id: "ai-operating-layer-test-2026-07-06",
      name: "AI Operating Layer",
      sector: "digital",
      style: "gradient",
      active: 0,
      slides: [
        { layout: "cover", logo: "main", bgStyle: "circles", kicker: "INTERNAL PITCH · JULY 2026", title: "AI Operating Layer", subtitle: "A practical way to make agency work faster, sharper and easier to repeat." },
        { layout: "agenda", logo: "main", kicker: "WHAT WE WILL COVER", title: "The story in ten minutes", body: "Why AI needs an operating layer\nWhere agency work slows down\nWhat the layer actually does\nHow teams use it day to day\nWhat we pilot first" },
        { layout: "section", logo: "ring", bgStyle: "gradient", kicker: "01", title: "The shift is not more tools", subtitle: "The real value is a shared way of working." },
        { layout: "bullets", logo: "main", kicker: "CURRENT REALITY", title: "AI is useful, but still too individual", body: "Everyone finds their own prompts, files and shortcuts.\nGood outputs get trapped in one chat or one person's folder.\nQuality depends on who happens to know the tool best.\nRepeatable agency knowledge is still scattered across decks, docs and memory." },

        { layout: "chart", logo: "main", bgStyle: "gradient", kicker: "IMPACT AREAS", title: "The strongest early wins are repeatable work", body: "Brief synthesis | 85\nFirst draft assembly | 78\nResearch summaries | 72\nDeck production | 64\nReporting narratives | 58" },

    function b64urlEncode(obj) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    const target = "https://deck-studio-snowy.vercel.app/index.html?d=ai-operating-layer#d=" + b64urlEncode(payload);

    window.location.replace(target);
