<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card, Shea Wilson</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Spectral:ital,wght@0,200;0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
  /* 85 x 55 mm, the UK card size. ?side=front|back shows one side at trim size, ?bleed=1 adds 3 mm for print,
     ?url= changes where the code points. Print (or save as PDF) gives one page per side. */
  :root { --serif: 'Spectral', Georgia, serif; --sans: 'DM Sans', system-ui, sans-serif; --ink: #0a0a0a; --ink-2: rgba(10,10,10,.64); --whisper: rgba(10,10,10,.46);
    --bleed: 0mm; }
  .bleed-on { --bleed: 3mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #eceae6; }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-wrap: wrap; gap: 14mm; align-items: center; justify-content: center; padding: 14mm; }
  .one body, body.one { padding: 0; gap: 0; background: #fff; min-height: 0; display: block; }

  .side { position: relative; width: calc(85mm + 2 * var(--bleed)); height: calc(55mm + 2 * var(--bleed)); background: #fff; overflow: hidden; flex: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.12); border-radius: 3.2mm; }
  body.one .side { box-shadow: none; border-radius: 0; }
  .trim { position: absolute; inset: var(--bleed); }

  /* Front: the horizon from the homepage */
  .eclipse { position: absolute; left: calc(50% - 66mm); top: 32mm; width: 132mm; aspect-ratio: 1; }
  .corona { position: absolute; inset: -9%; border-radius: 50%;
    background: conic-gradient(from -64deg, #ed1652 0deg, #ff6a1a 36deg, #ffb22c 64deg, #fde9cf 96deg, #e3ebff 140deg, #43d9ff 182deg, #e3ebff 220deg, #8a3cff 256deg, #fde9cf 292deg, #3a17e0 326deg, #ed1652 360deg);
    -webkit-mask: radial-gradient(closest-side, #000 75%, rgba(0,0,0,.86) 79%, rgba(0,0,0,.58) 84%, rgba(0,0,0,.3) 89%, rgba(0,0,0,.11) 94%, transparent 100%);
            mask: radial-gradient(closest-side, #000 75%, rgba(0,0,0,.86) 79%, rgba(0,0,0,.58) 84%, rgba(0,0,0,.3) 89%, rgba(0,0,0,.11) 94%, transparent 100%); }
  .disc { position: absolute; inset: 0; border-radius: 50%; background: #fff; }
  .name { position: absolute; left: 0; right: 0; top: 11.4mm; text-align: center; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 6.4mm; letter-spacing: -.012em; line-height: 1; }
  .role { position: absolute; left: 0; right: 0; top: 19.6mm; text-align: center; font-size: 2.55mm; font-weight: 400; color: var(--ink-2); letter-spacing: .005em; }
  .reach { position: absolute; left: 0; right: 0; bottom: 6.2mm; text-align: center; font-size: 2.35mm; font-weight: 400; line-height: 1.6; color: var(--ink-2); }
  .reach b { font-weight: 500; color: var(--ink); }

  /* Back: the work, and the code that opens it in 3D. The phone tracks this side. */
  .head { position: absolute; left: 6mm; top: 5.4mm; font-family: var(--serif); font-weight: 300; font-size: 4.9mm; line-height: 1.02; letter-spacing: -.028em; word-spacing: -.03em; }
  .head em { font-style: italic; letter-spacing: -.018em; }
  .tiles { position: absolute; left: 6mm; right: 6mm; top: 13.6mm; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.2mm; }
  .tile { position: relative; height: 16.6mm; border-radius: 3.1mm; corner-shape: squircle; overflow: hidden; background: #fff; isolation: isolate;
    box-shadow: 0 0 0 .18mm rgba(10,10,10,.07), 0 .8mm 2.2mm rgba(10,10,10,.06); }
  @supports not (corner-shape: squircle) { .tile { border-radius: 2.2mm; } }
  .tile .wash { position: absolute; inset: -30%; z-index: -1; filter: blur(2.6mm); opacity: .78;
    background: radial-gradient(closest-side at 50% 42%, var(--a), transparent), radial-gradient(closest-side at 70% 70%, var(--b), transparent 90%), radial-gradient(closest-side at 28% 72%, var(--c), transparent 90%); }
  .tile img { position: absolute; display: block; }
  .t-snap .res { width: 118%; left: -26%; top: 14%; rotate: -5deg; border-radius: .9mm; box-shadow: 0 .6mm 1.6mm rgba(20,0,80,.25); }
  .t-snap .phone { height: 116%; left: 44%; top: 8%; filter: drop-shadow(0 .8mm 1.2mm rgba(20,0,80,.3)); }
  .t-jump .rep { width: 132%; left: -8%; top: 22%; rotate: 2deg; border-radius: .8mm; box-shadow: 0 .6mm 1.8mm rgba(0,40,20,.2); }
  .t-heart { background: #06161b; }
  .t-heart .scr { width: 150%; left: -18%; top: 16%; rotate: -7deg; border-radius: .9mm; box-shadow: 0 .8mm 2mm rgba(0,0,0,.4); }
  .t-brain .ph { height: 118%; left: 16%; top: 10%; rotate: 3deg; filter: drop-shadow(0 .8mm 1.4mm rgba(50,0,110,.35)); }
  .names { position: absolute; left: 6mm; right: 6mm; top: 31.6mm; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.2mm; font-size: 1.85mm; white-space: nowrap; font-weight: 400; color: var(--ink-2); letter-spacing: .004em; }
  .how { position: absolute; left: 6mm; bottom: 5.2mm; font-size: 2.3mm; font-weight: 400; line-height: 1.45; color: var(--ink-2); max-width: 44mm; }
  .how b { display: block; font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 3.5mm; color: var(--ink); letter-spacing: -.01em; margin-bottom: .5mm; }
  .qr { position: absolute; right: 6mm; bottom: 5.4mm; width: 12mm; height: 12mm; }
  .qr svg { display: block; width: 100%; height: 100%; }

  /* Print: Chrome's PDF output can't do the masked ring or the blurred washes, so the artwork comes from
     600 dpi renders of this page (?layer=art) and the type and code stay vector on top. */
  .print-art { display: none; position: absolute; inset: 0; width: 100%; height: 100%; }
  .layer-art :is(.name, .role, .reach, .head, .names, .how, .qr) { visibility: hidden; }
  @page { size: 91mm 61mm; margin: 0; }
  @media print {
    html, body { background: #fff; }
    body { display: block; padding: 0; }
    .side { --bleed: 3mm; box-shadow: none; border-radius: 0; break-after: page; }
    .print-art { display: block; }
    .eclipse, .tiles { display: none; }
  }
</style>
</head>
<body>

<section class="side front" aria-label="Front">
  <img class="print-art" src="front-art.png" alt="">
  <div class="trim">
    <div class="eclipse" aria-hidden="true"><div class="corona"></div><div class="disc"></div></div>
    <p class="name">Shea Wilson</p>
    <p class="role">Design engineer</p>
    <p class="reach"><b>design@sheawilson.uk</b><br>sheawilson.uk</p>
  </div>
</section>

<section class="side back" aria-label="Back">
  <img class="print-art" src="back-art.png" alt="">
  <div class="trim">
    <p class="head">Always making <em>something.</em></p>
    <div class="tiles">
      <div class="tile t-snap" style="--a:#3a17e0; --b:#ed1652; --c:#ff6a1a"><i class="wash"></i><img class="res" src="../../assets/media/home/snapshot-results.webp" alt=""><img class="phone" src="../../assets/media/home/snapshot-phone.webp" alt=""></div>
      <div class="tile t-jump" style="--a:#4fae86; --b:#8fd4b4; --c:#0b5c45"><i class="wash"></i><img class="rep" src="../../assets/media/home/jumpstart-report.webp" alt=""></div>
      <div class="tile t-heart" style="--a:#43d9ff; --b:#ed1652; --c:#08717d"><i class="wash"></i><img class="scr" src="../assets/heart-frame.webp" alt=""></div>
      <div class="tile t-brain" style="--a:#8a3cff; --b:#5b2bff; --c:#c77dff"><i class="wash"></i><img class="ph" src="../../assets/media/home/brain-home.webp" alt=""></div>
    </div>
    <div class="names"><span>Smoking Snapshot</span><span>JumpStart</span><span>Heart Health</span><span>Brain Dump</span></div>
    <p class="how"><b>See it in 3D</b>Scan the code, then point your camera at this side of the card.</p>
    <div class="qr" aria-label="QR code"></div>
  </div>
</section>

<script type="module">
  import qrcode from '../vendor/qr/qrcode.mjs';
  const q = new URLSearchParams(location.search);
  const side = q.get('side');
  if (side) { document.body.classList.add('one'); document.querySelectorAll('.side').forEach((s) => { if (!s.classList.contains(side)) s.remove(); }); }
  if (q.get('bleed') === '1') document.documentElement.classList.add('bleed-on');
  if (q.get('layer') === 'art') document.documentElement.classList.add('layer-art');

  // Square modules on a quiet zone of zero: the card's own margin is the quiet zone
  const url = q.get('url') || 'https://sheawilson.uk/card';
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  const n = qr.getModuleCount();
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  const slot = document.querySelector('.qr');
  if (slot) slot.innerHTML = `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="${url}"><path d="${d}" fill="#0a0a0a"/></svg>`;

  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })));
  document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
